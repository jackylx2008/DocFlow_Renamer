[project]
name = "warranty-application-archive"
version = "0.3.0"
description = "质保作业申请案卷归档与人工审查数据生成"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF",
    "PyYAML",
    "openpyxl",
    "python-docx",
]

[project.scripts]
warranty-application-archive = "warranty_application_archive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["warranty_application_archive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
